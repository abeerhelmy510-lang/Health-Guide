<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الصحة الذكي | عبير حلمي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; }
        .disclaimer { color: #d93025; background: #fce8e6; padding: 15px; border-radius: 10px; border: 2px solid #d93025; font-weight: bold; margin-bottom: 20px; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 12px; border: 2px solid #ddd; font-size: 1.1em; box-sizing: border-box; outline: none; transition: 0.3s; text-align: right; }
        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 12px; font-size: 1.2em; cursor: pointer; margin-top: 15px; font-weight: bold; }
        #result { margin-top: 25px; display: none; }
        .card { background: #f8f9fa; border-right: 6px solid #1a73e8; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-align: right; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .card b { color: #d93025; font-size: 1.2em; }
        .programmer { text-align: center; margin-top: 50px; padding-top: 20px; border-top: 1px solid #eee; color: #5f6368; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 دليلك الصحي الذكي</h1>
    <div class="disclaimer">⚠️ يجب استشارة الطبيب فوراً. الموقع للاسترشاد فقط.</div>

    <p style="text-align: right;">صفي أعراضك بالتفصيل (صداع، كحة، ألم معدة، زكام، إرهاق...):</p>
    <textarea id="userInput" placeholder="اكتبي كل اللي حاسة بيه هنا..."></textarea>
    <button onclick="smartCheck()">تحليل كافة الأعراض</button>

    <div id="result">
        <h2 style="text-align: right; color: #3c4043;">النتائج المقترحة لحالتك:</h2>
        <div id="findings"></div>
    </div>

    <div class="programmer">تمت البرمجة بواسطة <strong>💎 عبير حلمي 💎</strong></div>
</div>

<script>
    function smartCheck() {
        const text = document.getElementById('userInput').value.trim();
        const findings = document.getElementById('findings');
        const resDiv = document.getElementById('result');

        if (!text) { alert("من فضلك صفي أعراضك أولاً"); return; }

        // قاعدة بيانات ضخمة ومرنة (تتعرف على الكلمة بأكثر من شكل)
        const symptomsDb = [
            { tags: ["معد", "بطن", "غثيان", "قيء", "ترجيع", "هضم", "مغص"], title: "اضطرابات الجهاز الهضمي", info: "قد تشير للألم في المعدة أو عسر الهضم. يُنصح بشرب سوائل دافئة وتجنب الأكل الدسم." },
            { tags: ["صداع", "رأس", "دماغ", "شقيقة"], title: "صداع وإجهاد", info: "غالباً ناتج عن التوتر أو قلة النوم. ارتاحي في مكان هادئ واشربي ماء." },
            { tags: ["كحة", "كحه", "سعال", "بلغم", "صدر", "تنفس"], title: "أعراض الجهاز التنفسي", info: "قد تكون نزلة برد أو حساسية. السوائل الدافئة مهمة، وإذا زاد ضيق التنفس يجب رؤية طبيب." },
            { tags: ["حرارة", "سخون", "سخن", "حمي"], title: "ارتفاع درجة الحرارة", info: "دليل على عدوى. استخدمي كمادات فاتر، وإذا تخطت 39 درجة استشيري طبيب." },
            { tags: ["عظم", "ظهر", "مفصل", "رقب", "جسمي"], title: "آلام العظام والعضلات", info: "قد يكون إرهاقاً بدنياً. التدفئة والراحة ضروريان." },
            { tags: ["زكام", "برد", "رشح", "أنف"], title: "نزلة برد / إنفلونزا", info: "راحة تامة، فيتامين C، ومشروبات دافئة." },
            { tags: ["دوخ", "دوار", "توازن"], title: "دوار وعدم اتزان", info: "قد يتعلق بضغط الدم أو الإجهاد. تجنبي الحركة المفاجئة." }
        ];

        let found = [];
        symptomsDb.forEach(item => {
            // كود ذكي يبحث عن "جزء" من الكلمة (عشان يفهم كحة وكحه وكحتي)
            let isMatch = item.tags.some(tag => text.includes(tag));
            if (isMatch) {
                found.push(`<div class="card"><b>📌 ${item.title}:</b><br>${item.info}</div>`);
            }
        });

        resDiv.style.display = "block";
        if (found.length > 0) {
            findings.innerHTML = found.join("");
        } else {
            findings.innerHTML = "<div class='card'>لم يتم العثور على عرض محدد. صفي حالتك بكلمات مختلفة أو استشيري الطبيب فوراً.</div>";
        }
    }
</script>
</body>
</html>
